<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACU AI Chatbot</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #f0f2f5; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        header { background: #1a3a6b; color: white; width: 100%; max-width: 800px; padding: 16px; border-radius: 12px 12px 0 0; text-align: center; }
        header h1 { font-size: 1.4rem; }
        header p { font-size: 0.85rem; opacity: 0.8; margin-top: 4px; }
        .chat-container { background: white; width: 100%; max-width: 800px; min-height: 400px; padding: 20px; border: 1px solid #ddd; overflow-y: auto; }
        .message { margin-bottom: 20px; padding: 12px; border-radius: 8px; }
        .question { background: #e8f0fe; border-left: 4px solid #1a3a6b; }
        .answer { background: #f8f9fa; border-left: 4px solid #28a745; }
        .label { font-size: 0.75rem; font-weight: bold; color: #666; margin-bottom: 6px; }
        .empty-state { text-align: center; color: #999; padding: 60px 20px; }
        .input-area { background: white; width: 100%; max-width: 800px; padding: 16px; border: 1px solid #ddd; border-top: 2px solid #1a3a6b; border-radius: 0 0 12px 12px; display: flex; gap: 10px; }
        .input-area input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 0.95rem; }
        .input-area input:focus { border-color: #1a3a6b; outline: none; }
        .input-area button { padding: 10px 20px; background: #1a3a6b; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 0.95rem; }
        .input-area button:hover { background: #14305a; }
    </style>
</head>
<body>
    <header>
        <h1>🎓 ACU AI Chatbot</h1>
        <p>Ask me anything about Acıbadem University</p>
    </header>

    <div class="chat-container" id="chatContainer">
        {% if messages %}
            {% for msg in messages %}
                <div class="message question"><div class="label">You asked</div>{{ msg.question }}</div>
                <div class="message answer"><div class="label">AI Answer</div>{{ msg.answer }}</div>
            {% endfor %}
        {% else %}
            <div class="empty-state">
                <p>👋 No conversations yet. Ask a question below!</p>
            </div>
        {% endif %}
    </div>

    <div class="input-area">
        <input type="text" id="questionInput" placeholder="e.g. What programs does ACU offer?" onkeypress="if(event.key==='Enter') sendQuestion()"/>
        <button onclick="sendQuestion()">Ask</button>
    </div>

    <script>
        async function sendQuestion() {
            const input = document.getElementById('questionInput');
            const question = input.value.trim();
            if (!question) return;

            const container = document.getElementById('chatContainer');
            const emptyState = container.querySelector('.empty-state');
            if (emptyState) emptyState.remove();

            const msgId = 'msg-' + Date.now();
            container.innerHTML += `
                <div class="message question">
                    <div class="label">You asked</div>
                    ${question}
                </div>
                <div class="message answer" id="${msgId}">
                    <div class="label">AI Answer</div>
                    ⏳ Thinking...
                </div>`;

            input.value = '';
            container.scrollTop = container.scrollHeight;

            try {
                const response = await fetch('/api/chat/', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: question})
                });
                const data = await response.json();
                document.getElementById(msgId).innerHTML = `
                    <div class="label">AI Answer</div>
                    ${data.answer || data.error || 'No response received'}`;
            } catch (error) {
                document.getElementById(msgId).innerHTML = `
                    <div class="label">AI Answer</div>
                    ❌ Could not reach the AI. Please try again.`;
            }
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
