version: '3.8'

services:

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: acudb
      POSTGRES_USER: acuuser
      POSTGRES_PASSWORD: acupass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acuuser -d acudb"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: ./webapp
    restart: always
    command: >
      sh -c "sleep 5 &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./webapp:/app
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_NAME: acudb
      DB_USER: acuuser
      DB_PASSWORD: acupass
      OLLAMA_URL: http://ollama:11434
      DJANGO_SECRET_KEY: change-this-in-production
      DEBUG: "True"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: