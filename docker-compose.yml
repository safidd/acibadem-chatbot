services:
  ollama:
    image: ollama/ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  db:
    image: pgvector/pgvector:pg15
    restart: always
    environment:
      POSTGRES_DB: acudb
      POSTGRES_USER: acuuser
      POSTGRES_PASSWORD: acupass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acuuser -d acudb"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: ./webapp
    restart: always
    command: >
      sh -c "sleep 5 &&
             python manage.py migrate &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 4"
    volumes:
      - ./webapp:/app
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_NAME: acudb
      DB_USER: acuuser
      DB_PASSWORD: acupass
      OLLAMA_URL: http://ollama:11434
      DJANGO_SECRET_KEY: change-this-in-production
      DEBUG: "True"
      REDIS_URL: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  ollama_data: