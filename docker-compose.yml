services:
  db:
    image: pgvector/pgvector:pg15
    platform: linux/arm64
    restart: always
    ports:
      - "5432:5432"     # <-- Add these two lines
    environment:
      POSTGRES_DB: acudb
      POSTGRES_USER: acuuser
      POSTGRES_PASSWORD: acupass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acuuser -d acudb"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: ./webapp
    restart: always
    command: >
      sh -c "sleep 5 &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./webapp:/app
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_NAME: acudb
      DB_USER: acuuser
      DB_PASSWORD: acupass
      OLLAMA_URL: http://ollama:11434
      DJANGO_SECRET_KEY: change-this-in-production
      DEBUG: "True"
    depends_on:
      db:
        condition: service_healthy

  ollama:
    image: ollama/ollama
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  ollama_data:
